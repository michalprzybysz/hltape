blank_issues_enabled: false
contact_links:
  - name: This project is unmaintained
    url: https://github.com/michalprzybysz/hltape#readme
    about: >-
      Nobody reviews issues or pull requests here and nothing will be fixed or merged. File one as
      a public record if you like, but expect no reply — if you need a fix, fork the project.
  - name: Report a security vulnerability
    url: https://github.com/michalprzybysz/hltape/security/policy
    about: >-
      This project handles wallet keys and executes real trades. Never report a vulnerability in a
      public issue. Use GitHub private vulnerability reporting or the contact in SECURITY.md.
