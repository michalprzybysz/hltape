name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR supersedes the run already in flight for that PR.
# Runs on main are never cancelled — that history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, Types, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # CI placeholders only. Next.js inlines NEXT_PUBLIC_* at build time, so the
          # required ones must be present or the produced bundle points nowhere. These
          # values are never used against a live network — no real key, address or
          # endpoint belongs in this file.
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:4000/auth
          NEXT_PUBLIC_WALLETCONNECT_ID: ci-placeholder-project-id
          NEXT_PUBLIC_TESTNET: "true"
