name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vulnerability report (informational, does not fail the build)
        # Printed in full and on purpose. The gate below only blocks on
        # criticals, so this step is the honest picture of the tree. Read it.
        continue-on-error: true
        run: pnpm audit --prod

      - name: Fail on critical vulnerabilities
        # The threshold is `critical`, not zero, and not `high`. Zero is not
        # reachable today and pretending otherwise would make this check
        # meaningless.
        #
        # As of 2026-09-20 `pnpm audit --prod` reports 19 findings across 16
        # distinct advisories: 16 moderate, 3 high, no criticals and no lows.
        # Nothing is suppressed: the root package.json carries no
        # pnpm.auditConfig, so that number is the whole tree. Every direct
        # dependency with a fix available has already been updated. What is
        # left is transitive and needs an upstream release, not a change in
        # this repo:
        #
        #   - axios (10 of the 16) arrives only through the pinned
        #     @coinbase/cdp-sdk override, under wagmi -> @wagmi/connectors ->
        #     @base-org/account.
        #   - ws, uuid and decode-uri-component are browser-side only. Every
        #     path is rooted in apps/app: siwe -> ethers, and
        #     @rainbow-me/rainbowkit -> wagmi -> @wagmi/connectors ->
        #     @walletconnect/* -> @reown/appkit / @metamask/sdk. NONE of them
        #     reaches apps/api. They cannot be dropped without replacing the
        #     wallet connection layer.
        #   - valibot is the only one that does reach the API, via
        #     @nktkas/hyperliquid in both apps/api and packages/sdk. esbuild
        #     comes from the drizzle-kit toolchain and is build-time only.
        #
        # What this gate actually promises: a NEW critical advisory anywhere in
        # the production dependency tree turns the build red. It does not
        # promise a clean tree.
        run: pnpm audit --prod --audit-level=critical

      - name: Scan for committed secrets
        # The lefthook pre-commit hook runs secretlint on staged files, but a
        # contributor who never ran `pnpm lefthook install` has no such hook.
        # This scans the whole tree so a leaked key cannot land through a PR.
        run: pnpm secretlint --maskSecrets --secretlintignore .gitignore "**/*"
