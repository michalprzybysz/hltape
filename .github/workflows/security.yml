name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vulnerability report (informational, does not fail the build)
        # Printed in full and on purpose. The gate below only blocks on
        # criticals, so this step is the honest picture of the tree. Read it.
        continue-on-error: true
        run: pnpm audit --prod

      - name: Fail on critical vulnerabilities
        # The threshold is `critical`, not zero, and not `high`. Zero is not
        # reachable today and pretending otherwise would make this check
        # meaningless.
        #
        # As of 2026-09-20 `pnpm audit --prod` reports 142 findings across 124
        # distinct advisories: 7 low, 75 moderate, 58 high, 2 critical (1 of
        # which is ignored, see below). Every direct dependency with a fix
        # available has already been updated. What is left is transitive and
        # needs an upstream release, not a change in this repo:
        #
        #   - The large majority sits under @rainbow-me/rainbowkit -> wagmi ->
        #     @wagmi/connectors -> @walletconnect/* -> @reown/appkit: axios,
        #     fast-uri, brace-expansion, minimatch, picomatch, hono, ws,
        #     socket.io-parser, form-data, lodash, browserslist, defu, h3.
        #     These reach the browser bundle through the wallet connectors and
        #     cannot be dropped without replacing the wallet connection layer.
        #   - Smaller clusters come from @sentry/node, @sentry/nextjs,
        #     @logtail/node and viem.
        #
        # Ignored by GHSA id in the root package.json (pnpm.auditConfig.ignoreGhsas):
        #
        #   GHSA-pw9m-5jxm-xr6h (critical) - better-auth: OAuth refresh-token
        #   replay via missing client authentication on the oidc-provider and
        #   mcp plugins. Fixed upstream in better-auth >= 1.6.11.
        #   This repo pins better-auth to ~1.4.22 because 1.5+ changes the SIWE
        #   client API (authClient.siwe.nonce / .verify no longer accept
        #   walletAddress), so upgrading is a code change plus an auth schema
        #   regeneration, not a version bump. The vulnerable code path is not
        #   reachable in this configuration: apps/api/src/lib/auth.ts registers
        #   only the siwe and admin plugins, and neither oidcProvider nor mcp
        #   is used anywhere in the tree. Drop this ignore the moment
        #   better-auth is upgraded - it is a deferral, not a verdict.
        #
        # What this gate actually promises: a NEW critical advisory anywhere in
        # the production dependency tree turns the build red. It does not
        # promise a clean tree.
        run: pnpm audit --prod --audit-level=critical

      - name: Scan for committed secrets
        # The lefthook pre-commit hook runs secretlint on staged files, but a
        # contributor who never ran `pnpm lefthook install` has no such hook.
        # This scans the whole tree so a leaked key cannot land through a PR.
        run: pnpm secretlint --maskSecrets --secretlintignore .gitignore "**/*"
